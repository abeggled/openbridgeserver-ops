name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip install pytest

      - name: Validate channel manifests are well-formed JSON
        run: python3 -m json.tool channels/canary.json channels/staging.json channels/stable.json > /dev/null

      - name: Run tests
        run: pytest tests/ -v
